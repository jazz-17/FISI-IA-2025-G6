ible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive bg-primary text-primary-foreground shadow-xs hover:bg-primary/90 h-8 rounded-md px-3 has-[&gt;svg]:px-2.5 flex items-center gap-2"><!--[--><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-download-icon lucide-download w-4 h-4"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" x2="12" y1="15" y2="3"></line></svg> Cargar Programa <!--]--></button></div></div><textarea class="p-3 bg-background border grow rounded-md font-mono text-sm resize-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="Escribe tu programa Prolog aquí...">% Tres en Raya - Tablero y movimientos
% Representación del tablero como lista de 9 posiciones
% 1-9 para posiciones vacías, x/o para jugadores

% Ejemplo de tablero inicial
tablero_inicial([1,2,3,4,5,6,7,8,9]).

% Mostrar tablero con write()
mostrar_tablero([A,B,C,D,E,F,G,H,I]) :-
    write(&#39;Tablero actual:&#39;), nl,
    write(&#39; &#39;), write(A), write(&#39; | &#39;), write(B), write(&#39; | &#39;), write(C), nl,
    write(&#39;-----------&#39;), nl,
    write(&#39; &#39;), write(D), write(&#39; | &#39;), write(E), write(&#39; | &#39;), write(F), nl,
    write(&#39;-----------&#39;), nl,
    write(&#39; &#39;), write(G), write(&#39; | &#39;), write(H), write(&#39; | &#39;), write(I), nl.

% Hacer un movimiento
hacer_movimiento(Pos, Jugador, TableroAntes, TableroDespues) :-
    nth1(Pos, TableroAntes, Pos),  % Posición debe estar vacía
    nth1(Pos, TableroDespues, Jugador),  % Colocar jugador
    replace_nth1(Pos, TableroAntes, Jugador, TableroDespues).

% Verificar victoria
ganar([X,X,X,_,_,_,_,_,_], X) :- X \= &#39;_&#39;.
ganar([_,_,_,X,X,X,_,_,_], X) :- X \= &#39;_&#39;.
ganar([_,_,_,_,_,_,X,X,X], X) :- X \= &#39;_&#39;.

% Mensaje de victoria
anunciar_victoria(Jugador) :-
    write(&#39;¡Felicidades! El jugador &#39;), 
    write(Jugador), 
    write(&#39; ha ganado!&#39;), nl.</textarea></div><div class="bg-card border rounded-lg p-4"><h3 class="text-lg font-semibold mb-4">Consultas</h3><div class="space-y-3"><div class="flex gap-2"><input value="likes(sam, X)." type="text" class="flex-1 p-2 bg-background border rounded-md font-mono text-sm focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="?- likes(sam, X)."><button data-slot="button" class="justify-center whitespace-nowrap rounded-md text-sm font-medium transition-all disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg:not([class*=&#39;size-&#39;])]:size-4 shrink-0 [&amp;_svg]:shrink-0 outline-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive bg-primary text-primary-foreground shadow-xs hover:bg-primary/90 h-9 px-4 py-2 has-[&gt;svg]:px-3 flex items-center gap-2"><!--[--><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-play-icon lucide-play w-4 h-4"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg> Ejecutar <!--]--></button></div><div><p class="text-sm text-muted-foreground mb-2"> Consultas de ejemplo: </p><div class="flex flex-wrap gap-2"><!--[--><button data-slot="button" class="inline-flex items-center justify-center whitespace-nowrap font-medium transition-all disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg:not([class*=&#39;size-&#39;])]:size-4 shrink-0 [&amp;_svg]:shrink-0 outline-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive border bg-background shadow-xs hover:bg-accent hover:text-accent-foreground dark:bg-input/30
